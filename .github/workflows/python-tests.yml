name: Python tests

on:
  push:
    branches: [main, master]
  workflow_dispatch:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run tests
        run: timeout 120 python3 -m unittest discover -s tests

  sandbox-integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Verify filesystem and network sandboxing
        run: python3 -m unittest tests.test_sandbox_integration -v
