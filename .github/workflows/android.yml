name: Android CI

on:
  push:
    branches: [main, master, beta]
  workflow_dispatch:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK packages
        run: sdkmanager "platforms;android-34" "build-tools;34.0.0"

      - name: Build debug APK
        env:
          GRADLE_VERSION: "8.9"
        run: |
          curl --fail --location --silent --show-error \
            "https://services.gradle.org/distributions/gradle-${GRADLE_VERSION}-bin.zip" \
            --output /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /tmp
          /tmp/gradle-${GRADLE_VERSION}/bin/gradle \
            --project-dir android/idealagent --no-daemon assembleDebug

      - name: Create APK checksum
        run: |
          cd android/idealagent/app/build/outputs/apk/debug
          sha256sum *.apk > ideal-agent-app-debug.apk.sha256

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ideal-agent-app-debug
          path: |
            android/idealagent/app/build/outputs/apk/debug/*.apk
            android/idealagent/app/build/outputs/apk/debug/*.sha256
          if-no-files-found: error
